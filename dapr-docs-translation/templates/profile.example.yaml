# profile.example.yaml — copy to <repo>/translations/profile.yaml and fill in. Field meanings: references/profile-spec.md
schema: 1
repo: .                                  # repository root, relative to the directory the run starts in
translationsRoot: translations
defaultLocale: zh-CN
locales:
  zh-CN:
    name: 简体中文
    cjk: true
    notes: 读者称"你";全角标点;中英文与数字之间加半角空格

sources:
  description: <what the source documents are and where they come from>
  # glob:                                # built-in alternative to `discovery` when the sources live in this repo
  #   root: docs
  #   include: ["**/*.md", "**/*.mdx"]
  discovery:                             # read-only adapter; prints NDJSON {doc, bytes, sha256, external}
    cwd: .
    command: node translations/discover.mjs --locale {locale}

externalTranslations:
  policy: skip                           # skip documents that already have an external translation
  evidence: []                           # read-only external translations usable as glossary evidence, e.g. ["vendor/upstream/docs/i18n/{locale}/"]

writeScope: [translations/]
readOnly: [src/, scripts/, package.json]
forbidden:
  - git push / stash / reset / checkout / new branches / --no-verify

priority:
  - { tier: 1, match: ["README.md", "docs/getting-started/"] }

budgets:
  maxRunMinutes: 240
  maxDocs: 10
  maxSourceBytes: 80000
  minMinutesToStartDoc: 20

commit:
  enabled: true
  messagePrefix: "docs(translation)"
  trailer: ""

timezone: America/Los_Angeles

rules:
  # checks:                             # opt-in tolerances matching an existing translation convention (default: strict)
  #   fenceComments: translate           # fenced code identical except comment text
  #   inlinePlaceholders: translate      # inline-code prose placeholders may be translated one for one
  #   localizedUrls: allow               # external URLs may gain a leading /zh-cn/ style locale segment
  doNotTranslateSeeds: []
  links: keep relative links unchanged
  frontmatterTranslatable: [title, description]
  extra: []

# --- optional, see references/profile-spec.md ---
# output:                                # where accepted translations go; default <translationsRoot>/locales/<L>/content/<doc>
#   template: "src/content/docs/{locale}/{doc}"
# models: { translate: haiku, review: haiku, escalate: sonnet }
# keepBaseSource: true                   # keep the translated source so later changes can be applied as a diff
